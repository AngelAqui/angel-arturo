    const note=e.target.closest('[data-note]');if(note){const selected=note.dataset.note;renderNotes(selected);$(`#window-notes [data-note="${selected}"]`)?.focus({preventScroll:true});}
    if(e.target.closest('[data-projects-back]'))renderProjects();
    const theme=e.target.closest('[data-theme-choice]');if(theme){const selected=theme.dataset.themeChoice;preferences.theme=selected;savePreferences();renderSettings();$(`[data-theme-choice="${selected}"]`)?.focus({preventScroll:true});}
    const wallpaper=e.target.closest('[data-wallpaper-choice]');if(wallpaper){const selected=wallpaper.dataset.wallpaperChoice;preferences.wallpaper=selected;savePreferences();renderSettings();$(`[data-wallpaper-choice="${selected}"]`)?.focus({preventScroll:true});}
    if(e.target.closest('[data-copy-link]'))copyLink();
    if(!e.target.closest('#system-menu')&&!e.target.closest('#system-trigger')){$('#system-menu').hidden=true;$('#system-trigger').setAttribute('aria-expanded','false');}
  });
  document.addEventListener('change',e=>{if(e.target.id==='reduce-motion'){preferences.motion=e.target.checked?'reduced':'full';savePreferences();}});
  async function copyLink(){
    try {await navigator.clipboard.writeText(LINKEDIN);toast('Enlace de LinkedIn copiado.');}
    catch(_){const input=$('#window-contact .copy-field');if(input){input.hidden=false;input.focus();input.select();toast('El enlace está seleccionado. Pulsa Ctrl / ⌘ + C para copiarlo.');}}
  }
  $('#system-trigger').addEventListener('click',()=>{const menu=$('#system-menu');menu.hidden=!menu.hidden;$('#system-trigger').setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)$('button',menu).focus();});
  $('#active-app').addEventListener('click',()=>{if(activeId)focusWindow(activeId);else openApp('about');});
  $$('[data-menu]').forEach(button=>button.addEventListener('click',()=>{const menu=button.dataset.menu;if(menu==='explore')openApp('projects');if(menu==='appearance')openApp('settings');if(menu==='help')openApp('help');}));
  $('.search-trigger').addEventListener('click',showSearch);$('.appearance-trigger').addEventListener('click',()=>openApp('settings'));
  $('#show-desktop').addEventListener('click',()=>{$$('.window').forEach(win=>win.classList.add('minimized'));nextActive();$('#system-menu').hidden=true;$('#system-trigger').setAttribute('aria-expanded','false');toast('Tus ventanas siguen en el dock. Haz clic para recuperarlas.');});
  $('#close-search').addEventListener('click',()=>hideSearch());
  $('#spotlight').addEventListener('click',e=>{if(e.target.id==='spotlight')hideSearch();});
  $('#search-input').addEventListener('input',renderSearch);
  $('#search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#search-results button')?.click();}if(e.key==='ArrowDown'){e.preventDefault();$('#search-results button')?.focus();}});
  $('#spotlight').addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      const elements=$$('input,button', $('#spotlight'));const first=elements[0],last=elements.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#spotlight').hidden)showSearch();else hideSearch();}
    if(e.key==='Escape'){
      if(!$('#spotlight').hidden){hideSearch();return;}
      if(!$('#system-menu').hidden){$('#system-menu').hidden=true;$('#system-trigger').setAttribute('aria-expanded','false');$('#system-trigger').focus();return;}
      if(activeId)minimize(activeId);
    }
  });
  window.addEventListener('resize',()=>{
    if(window.innerWidth<=760)return;
    $$('.window').forEach(win=>{
      win.style.width=`${Math.max(330,Math.min(definitions[win.dataset.app].width,innerWidth-170))}px`;
      win.style.height=`${Math.max(340,Math.min(definitions[win.dataset.app].height,innerHeight-185))}px`;
      win.style.left=`${Math.max(8,Math.min(win.offsetLeft,innerWidth-win.offsetWidth-12))}px`;
      win.style.top=`${Math.max(12,Math.min(win.offsetTop,innerHeight-win.offsetHeight-125))}px`;
    });
  });
  $('#windows').innerHTML='';
  $('#spotlight').hidden=true;$('#system-menu').hidden=true;
  applyPreferences();updateClock();setInterval(updateClock,30000);openApp('about');
})();
</script>
</body>
</html>
